name: Unzip & Build Sora Chan

on:
  push:
    paths:
      - 'SoraChan.zip'
  workflow_dispatch:

jobs:
  unzip-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project (overwrite existing files)
        run: |
          if [ ! -f SoraChan.zip ]; then
            echo "ERROR: SoraChan.zip not found in repo root"
            echo "Please upload SoraChan.zip to the root of the repository"
            exit 1
          fi
          echo "Unzipping SoraChan.zip (overwrite mode)..."
          unzip -o SoraChan.zip
          # If zip contains a top-level SoraChan/ folder, move contents to root
          if [ -d SoraChan ]; then
            echo "Moving files from SoraChan/ to repo root..."
            cp -rf SoraChan/. .
            rm -rf SoraChan
          fi
          echo "Unzip complete. Project structure:"
          find . -maxdepth 3 -type f | head -40

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Create Gradle Wrapper
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoraChan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
