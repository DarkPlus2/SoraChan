name: Unzip SoraChan.zip

on:
  workflow_dispatch:
  push:
    paths:
      - 'SoraChan.zip'

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clean + Unzip overwrite
        run: |
          if [ ! -f SoraChan.zip ]; then
            echo "Put SoraChan.zip in repo root first"
            exit 1
          fi
          find . -mindepth 1 -maxdepth 1 \
            ! -name 'SoraChan.zip' \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +
          rm -rf /tmp/sora_extract
          mkdir -p /tmp/sora_extract
          unzip -o SoraChan.zip -d /tmp/sora_extract
          if [ -d /tmp/sora_extract/SoraChan ]; then
            cp -rf /tmp/sora_extract/SoraChan/. .
          else
            cp -rf /tmp/sora_extract/. .
          fi
          rm -rf SoraChan
          echo "Unzip done"
          ls -la
          head -20 app/src/main/java/com/megaultimatesorachan/ai/MainActivity.kt || true
